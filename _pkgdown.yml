# L'url dichiarato qui finisce nei canonical di ogni pagina e in ogni <loc> della sitemap che
# pkgdown genera. Dal trasferimento del repo all'org corsaro-lab il valore vecchio non
# esisteva piu': la sitemap pubblicata mandava i motori su un 404, e dal 2026-09-29 su un 301
# verso un 404, perche' il sito personale ha cambiato dominio. Il sito vero e' questo.
url: https://corsaro-lab.github.io/SEMseeker/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <script>
        window.vmtrcq = window.vmtrcq || [];
        window.vmtrc = window.vmtrc || function (){window.vmtrcq.push(Array.prototype.slice.call(arguments))};
      </script>
      <script defer src="https://cdn.vemetric.com/main.js" id="vmtrc-scr" data-token="nWIrdnyvzA1sksDn"></script>

# Il nome dell'autore diventa un link al suo sito, ovunque pkgdown lo stampi: footer di ogni
# pagina (qui e' gia' attivo via footer.left = developed_by), sidebar della home, pagina autori.
authors:
  Luigi Corsaro:
    href: https://luigicorsaro.com/?utm_source=semseeker-docs

home:
  title: "semseeker — Stochastic Epigenetic Mutation Seeker"
  description: >
    Detect, quantify and analyse stochastic epigenetic mutations (SEMs)
    from DNA methylation data.

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [github]
  components:
    intro:
      text: "Get started"
      href: articles/getting-started.html
    articles:
      text: "Articles"
      menu:
        - text: "Getting started — epimutations & delta metrics"
          href: articles/getting-started.html
        - text: "Association analysis — all statistical models"
          href: articles/association-analysis.html
        - text: "Pathway and enrichment analysis"
          href: articles/pathway-analysis.html
    reference:
      text: "Reference"
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/corsaro-lab/SEMseeker

footer:
  structure:
    left: developed_by
    right: built_with
