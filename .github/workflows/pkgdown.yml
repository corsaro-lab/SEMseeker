# Build pkgdown site and deploy to gh-pages
# Triggered on push to main/master (production) or manually
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_SANDBOX_ENABLED: false
      RENV_ACTIVATE_PROJECT: 0
      NOT_CRAN: "true"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system libraries (macOS)
        run: brew install cairo fontconfig pkg-config

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Sys.setenv(NOT_CRAN = "true")
          install.packages(
            c("remotes", "pkgdown", "devtools", "BiocManager"),
            repos = "https://packagemanager.posit.co/cran/latest"
          )
          remotes::install_deps(
            dependencies = NA,
            repos = c(
              rpolars = "https://community.r-multiverse.org",
              CRAN    = "https://packagemanager.posit.co/cran/latest"
            )
          )
          # polars 2 renamed the columns of headerless files and changed the
          # default query engine, so SEMseeker stays below 2.0 until it moves
          # to another engine. community.r-multiverse.org serves only the latest
          # release: the last 1.x is installed from its GitHub tag, after
          # install_deps() has pulled 2.x. NOT_CRAN makes its configure step
          # download the prebuilt library instead of compiling Rust, and the
          # timeout covers that download (about 255 MB).
          Sys.setenv(NOT_CRAN = "true", R_DEFAULT_INTERNET_TIMEOUT = "1800")
          install.packages(
            "https://github.com/pola-rs/r-polars/archive/refs/tags/v1.16.0.tar.gz",
            repos = NULL, type = "source"
          )
          stopifnot(packageVersion("polars") < "2.0.0")
          # Bioconductor annotation packages — needed by probe_annotation_build()
          # and examples in the reference documentation
          BiocManager::install(
            c(
              "IlluminaHumanMethylationEPICanno.ilm10b4.hg19",
              "IlluminaHumanMethylation450kanno.ilmn12.hg19",
              "IlluminaHumanMethylation27kanno.ilmn12.hg19"
            ),
            ask = FALSE, update = FALSE
          )
        shell: Rscript {0}

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
