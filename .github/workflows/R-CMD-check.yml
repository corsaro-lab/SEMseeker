# CI: R CMD check + testthat — macOS only for now; re-enable Windows/Linux once green
on:
  push:
    branches-ignore: [main, master]   # direct push to main/master is blocked
  workflow_dispatch:
    inputs:
      os:
        description: 'Run on a single OS (or "all")'
        type: choice
        default: 'all'
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

name: R-CMD-check

jobs:
  # Build the OS matrix dynamically so that workflow_dispatch with
  # inputs.os ∈ {ubuntu-latest, macos-latest, windows-latest} runs only
  # that lane, while push / pull_request / workflow_dispatch+all keep
  # the full 3-OS matrix. We can't filter via `if: matrix.config.os ==`
  # on the downstream job because the matrix context isn't available
  # in job-level `if` (matrix is expanded after the conditional).
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OS: ${{ github.event.inputs.os }}
        run: |
          all='[{"os":"macos-latest","r":"release","args":"c(\"--no-manual\", \"--as-cran\")"},{"os":"windows-latest","r":"release","args":"c(\"--no-manual\", \"--as-cran\")"},{"os":"ubuntu-latest","r":"release","args":"c(\"--no-manual\", \"--as-cran\")"}]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_OS" && "$REQUESTED_OS" != "all" ]]; then
            filtered=$(echo "$all" | jq -c --arg os "$REQUESTED_OS" '[.[] | select(.os == $os)]')
          else
            filtered="$all"
          fi
          echo "matrix={\"config\":$filtered}" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: set-matrix
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # An explicit deadline, so exceeding it is a TIMEOUT — which GitHub reports
    # as such and whose logs it still uploads — rather than an abrupt kill.
    # Windows run 31852499666 failed with no failed step and no log at all
    # (`BlobNotFound`): nothing survived to say why, and the successful runs of
    # the days before had taken LONGER, so it was not the default deadline.
    # 330 minutes leaves headroom over the ~5h a healthy full matrix takes.
    timeout-minutes: 330

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RENV_CONFIG_SANDBOX_ENABLED: false
      RENV_ACTIVATE_PROJECT: 0
      # Required by polars installer (not on CRAN)
      NOT_CRAN: "true"
      # Fallback for `fs` when uv.h is missing on Linux runners
      # (no-op when P3M binary is used)
      USE_BUNDLED_LIBUV: 1

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # gdtools (transitive dep via ctdR → clusterProfiler) requires cairo + fontconfig.
      # XQuartz is installed only on macOS to provide /opt/X11/lib/libX11.6.dylib,
      # which R 4.6's tcltk was linked against at install time. Without XQuartz,
      # loading tcltk segfaults at first use (the cause of the test_check crash
      # root cause not yet found). This is the test that confirms whether the
      # segfault is actually in tcltk/X11 or somewhere else.
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo fontconfig pkg-config libomp
          # libomp is keg-only → symlink so dyld finds it when loading Rfast.so
          sudo ln -sf "$(brew --prefix libomp)/lib/libomp.dylib" "$(brew --prefix)/lib/libomp.dylib"
          brew install --cask xquartz

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libcairo2-dev libgit2-dev libsodium-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true   # enables P3M binary packages (no compilation)

      # Cache the R package library keyed on DESCRIPTION hash.
      # Cache hit = 0 installs; only misses when dependencies change.
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ matrix.config.r }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-${{ matrix.config.r }}-

      # Use remotes instead of pak/setup-r-dependencies so that
      # Additional_repositories (community.r-multiverse.org for polars) and
      # Remotes (drake69/ctdR) in DESCRIPTION are honoured correctly.
      # pak resolves deps before configuring extra repos, making polars unresolvable.
      #
      # dependencies = NA  →  only Imports/Depends/LinkingTo (skip Suggests).
      # Suggests (pathfindR, GEOquery, caret, …) include heavy Bioconductor packages
      # that are not needed for R CMD check and were the main source of install time.
      - name: Install R dependencies
        run: |
          Sys.setenv(NOT_CRAN = "true")
          # Serial install: parallel install on the Windows runner caused
          # bumphunter to be load-tested before its dep AnnotationDbi was
          # installed (install.packages did not respect the topological
          # dependency order under Ncpus > 1).
          options(Ncpus = 1L)
          # Use the repos configured by setup-r@v2 (with use-public-rspm: true,
          # on Linux this is the distro-specific P3M URL serving binaries).
          # The previous explicit "cran/latest" URL served source on Linux
          # and forced `fs` (and 8 transitive deps) to compile from source,
          # which failed because libuv headers were not on the runner.
          install.packages(
            c("remotes", "rcmdcheck", "testthat", "devtools", "BiocManager")
          )
          remotes::install_deps(
            dependencies = NA,
            repos = c(
              rpolars = "https://community.r-multiverse.org",
              getOption("repos")
            )
          )
          # Install Bioconductor packages used by the test suite. The set is
          # explicitly enumerated and kept in sync by `test-pkg_suggests_installed.R`,
          # the meta-test that scans every `skip_if_not_installed("pkg")` call in
          # the test files and asserts the named pkg is available. CI fails fast
          # if a test would silently skip due to a missing install here.
          #
          #   IlluminaHumanMethylation*anno  array tech detection
          #   limma                          lmFit+eBayes batch path
          #                                  (test-assoc_apply_stat_model_batch.R)
          #   AnnotationHub                  test-anno_area_granges_build.R
          #   TxDb.Hsapiens.UCSC.hg19.knownGene
          #                                  test-anno_concordance_report.R,
          #                                  test-anno_area_granges_build.R (genomic
          #                                  feature joins)
          # limma FIRST, and on its own. The three Illumina annotation packages
          # load minfi while they install, minfi needs limma, and asking for all
          # of them in one call does not guarantee limma is built before them:
          # when limma came later in the same vector the annotation packages
          # failed with "there is no package called 'limma'", left the runner
          # with no annotation at all, and the suite fell back to the row-count
          # technology heuristic and broke. A warm dependency cache hid this for
          # months; moving the repository to an organisation reset the cache and
          # exposed it.
          #
          # KEGGREST joins limma in that first call, and for the same reason one
          # layer deeper. It is nobody's direct dependency here: bumphunter
          # loads it, and so does AnnotationDbi, and both are loaded by the
          # packages of the vector below while they are being load-tested. Asked
          # for as part of that vector, KEGGREST was built LAST - after every
          # package that needs it - so the three Illumina annotation packages
          # and TxDb.Hsapiens.UCSC.hg19.knownGene all failed with "there is no
          # package called 'KEGGREST'" and were removed from the library. The
          # suite then failed at the first call that needs an annotation, which
          # reads as a defect of the package and is not one.
          #
          # options(Ncpus = 1L) above does not prevent this. Serialising the
          # installs stopped one package from being load-tested before another
          # was built, but it does not make BiocManager order a vector
          # topologically: the order asked for is the order used.
          BiocManager::install(c("limma", "KEGGREST"), ask = FALSE, update = FALSE)
          BiocManager::install(
            c(
              "IlluminaHumanMethylationEPICanno.ilm10b4.hg19",
              "IlluminaHumanMethylation450kanno.ilmn12.hg19",
              "IlluminaHumanMethylation27kanno.ilmn12.hg19",
              "AnnotationHub",
              "TxDb.Hsapiens.UCSC.hg19.knownGene",
              # org.Hs.eg.db  NOT optional for the GRanges backend, despite the
              #          fallback in .anno_entrez_to_symbol(). TxDb keys genes by
              #          Entrez id; without the symbol database the label of a
              #          gene region stays an Entrez id, and that label becomes
              #          AREA in the results. The Illumina path labels with
              #          symbols, so the two backends would key the same gene two
              #          ways and nothing would join. test-anno_area_granges_build.R
              "org.Hs.eg.db",
              # qvalue   test-io_misc_2.R: the `q` estimator of
              #          .assoc_adjust_vector(). Without it the test skips, and
              #          test-pkg_suggests_installed.R fails on purpose: a silent
              #          skip hides a coverage gap instead of reporting one.
              "qvalue"
            ),
            ask = FALSE, update = FALSE
          )
          # Install CRAN Suggests that are exercised by the test suite. These
          # are deliberately enumerated (rather than installed via
          # dependencies = "Suggests") because the full Suggests set pulls
          # in heavy chains (pathfindR → ggkegg, ctdR, etc.) that are not
          # needed for R CMD check and that have repeatedly broken CI.
          #   Rfast     test-assoc_glm_model_bulk.R (binomial_bulk)
          #   mockery   test-assoc_model_limma.R (mocked bindings)
          #   ggpubr    test-plot_box_plot.R (box plot rendering)
          #   circlize  test-enrich_circos_data.R (the circos drawing itself).
          #             test-coverage.yml already listed it; this file did not,
          #             so the three drawing tests skipped here and the
          #             suggests-installed meta-test failed the run.
          install.packages(c("Rfast", "mockery", "ggpubr", "circlize"))
        shell: Rscript {0}

      # The biological truth goes first: seconds, and if it fails the hour of
      # R CMD check below is not worth running. The package is installed from
      # the checkout so the test reads the code of this commit.
      - name: Biological truth (stops the job when it fails)
        run: |
          R CMD INSTALL --no-docs --no-multiarch .
          Rscript -e 'res <- as.data.frame(testthat::test_dir("tests/testthat", package = "SEMseeker", load_package = "installed", filter = "^truth_", reporter = "progress", stop_on_failure = FALSE)); if (nrow(res) == 0L || sum(res$failed) > 0 || any(res$error)) quit(status = 1)'
        shell: bash
        env:
          NOT_CRAN: "true"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.args }}
          error-on: '"error"'

      # `if: always()` so the evidence survives a failure. check-r-package
      # already uploads its own artifacts on failure, but only when it gets to
      # finish; this keeps whatever R CMD check had written to disk up to the
      # moment it stopped — which is exactly what was missing when the Windows
      # job died without a log.
      - name: Upload check directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: |
            check/**/*.log
            check/**/*.out
            check/**/*.fail
            check/**/00check.log
            check/**/tests/**
          if-no-files-found: ignore
          retention-days: 14
